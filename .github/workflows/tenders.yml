name: Post tenders to Telegram
on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC = 9:00 TR
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tendergram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and post tenders
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GOSZAKUP_TOKEN: ${{ secrets.GOSZAKUP_TOKEN }}
        run: python main.py run

      - name: Persist dedupe database
        run: |
          git config user.name "tendergram-bot"
          git config user.email "actions@github.com"
          git add tenders.db
          git diff --cached --quiet || git commit -m "Update tender database [skip ci]"
          git push
